# Actions → Configure Pages HTTPS → Run workflow

name: Configure Pages HTTPS

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT -f cname='utc.marawionline.com'

      - name: Enable Enforce HTTPS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT \
            -f cname='utc.marawionline.com' \
            -f https_enforced=true \
            || echo "If this fails, check Enforce HTTPS in Settings → Pages."
