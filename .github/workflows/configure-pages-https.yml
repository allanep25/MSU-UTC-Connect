# Actions → Configure Pages HTTPS → Run workflow

name: Configure Pages HTTPS

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Register custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT --input - <<'JSON'
          {
            "cname": "utc.marawionline.com",
            "build_type": "legacy",
            "source": {
              "branch": "gh-pages",
              "path": "/"
            }
          }
          JSON

      - name: Enable Enforce HTTPS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT --input - <<'JSON' || true
          {
            "cname": "utc.marawionline.com",
            "https_enforced": true,
            "build_type": "legacy",
            "source": {
              "branch": "gh-pages",
              "path": "/"
            }
          }
          JSON
