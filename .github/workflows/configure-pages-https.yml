# Re-run anytime: Actions → Configure Pages HTTPS → Run workflow
# Registers utc.marawionline.com and requests GitHub's TLS certificate.

name: Configure Pages HTTPS

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set custom domain (triggers certificate provisioning)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"utc.marawionline.com","build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo "Done. Check Settings → Pages for DNS and certificate status."

      - name: Try to enable Enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"utc.marawionline.com","https_enforced":true,"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' \
            || echo "Enforce HTTPS not available yet — retry this workflow in an hour."
