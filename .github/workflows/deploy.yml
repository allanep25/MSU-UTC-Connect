name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Deploy static site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          cname: utc.marawionline.com
          user_name: github-actions
          user_email: github-actions@github.com
          commit_message: "Deploy static site to GitHub Pages"

  configure-https:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      administration: write

    steps:
      - name: Read current Pages settings
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" > pages.json 2>/dev/null || echo '{}' > pages.json
          cat pages.json

      - name: Register custom domain (triggers TLS certificate)
        id: domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" -X PUT --input - <<'JSON'
          {
            "cname": "utc.marawionline.com",
            "build_type": "legacy",
            "source": {
              "branch": "gh-pages",
              "path": "/"
            }
          }
          JSON
          then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Custom domain registered via API."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages API could not set the domain. Use Settings → Pages (see docs/fix-https-custom-domain.md)."
          fi

      - name: Enable Enforce HTTPS (optional until certificate exists)
        if: steps.domain.outputs.ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT --input - <<'JSON' || true
          {
            "cname": "utc.marawionline.com",
            "https_enforced": true,
            "build_type": "legacy",
            "source": {
              "branch": "gh-pages",
              "path": "/"
            }
          }
          JSON
          echo "If this step failed, wait for the certificate in Settings → Pages, then enable Enforce HTTPS manually."
