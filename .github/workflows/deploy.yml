name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Your site publishes from the master branch (Settings → Pages).
# This workflow turns on HTTPS automatically when GitHub allows it.

jobs:
  enable-https:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Enable custom domain + HTTPS via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cname = 'utc.marawionline.com';

            async function getPages() {
              try {
                const { data } = await github.rest.repos.getPages({ owner, repo });
                core.info('Current Pages: ' + JSON.stringify(data, null, 2));
                return data;
              } catch (e) {
                core.warning('Could not read Pages config: ' + e.message);
                return null;
              }
            }

            await getPages();

            try {
              await github.rest.repos.updateInformationAboutPages({
                owner,
                repo,
                cname
              });
              core.info('Custom domain set to ' + cname);
            } catch (e) {
              core.warning('Could not set cname via API: ' + e.message);
            }

            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                await github.rest.repos.updateInformationAboutPages({
                  owner,
                  repo,
                  cname,
                  https_enforced: true
                });
                core.info('HTTPS enforcement enabled on attempt ' + attempt);
                return;
              } catch (e) {
                core.info('Attempt ' + attempt + '/12 — HTTPS not ready yet: ' + e.message);
                if (attempt < 12) await new Promise(r => setTimeout(r, 15000));
              }
            }
            core.warning('GitHub has not issued the certificate yet. One manual step remains — see HTTPS-SETUP.md');
