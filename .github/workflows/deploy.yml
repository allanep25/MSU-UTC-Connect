name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Site is published from the master branch (see repo Settings → Pages).
# This workflow only registers the custom domain and requests HTTPS via the API.

jobs:
  configure-https:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      administration: write

    steps:
      - name: Read current Pages settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" || true

      - name: Set custom domain (do not change publish branch)
        id: domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" -X PUT -f cname='utc.marawionline.com'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Custom domain set to utc.marawionline.com"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API could not set cname — set it in Settings → Pages if needed."
          fi

      - name: Request HTTPS enforcement
        if: steps.domain.outputs.ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT \
            -f cname='utc.marawionline.com' \
            -f https_enforced=true \
            || echo "::notice::Enable Enforce HTTPS manually in Settings → Pages if the certificate is ready."
